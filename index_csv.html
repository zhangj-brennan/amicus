<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Amicus Brief Collection</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>
  @font-face {
    font-family: "Benton";
    src: url("Benton Sans/Benton Sans Book.otf");
  }
  @font-face {
    font-family: "BentonStrong";
    src: url("Benton Sans/Benton Sans Bold.otf");
  }
  @font-face {
    font-family: "BentonMedium";
    src: url("Benton Sans/Benton Sans Medium.otf");
  }

  :root{
    --bg:#ffffff;
    --text:#000000;
    --muted:#666666;
    --line:#d9d9d9;
    --hover:#f3f3f3;
    --active:#000000;
    --activeText:#ffffff;
    --bar:#cfcfcf;
    --barHover:#a8a8a8;
    --barActive:#000000;
  }

  * { box-sizing:border-box; }

  body{
    margin:0;
    font-family:"Benton", sans-serif;
    color:var(--text);
    background:var(--bg);
  }

  .topbar{
    max-width:1000px;
    position:sticky;
    top:0;
    z-index:50;
    background:var(--bg);
    border-top:3px solid black;
    border-bottom:1px solid black;
    padding:10px 12px 12px;
  }

  h1{
    margin:0 0 12px;
    font-size:24px;
    line-height:1;
    font-family:"BentonStrong", sans-serif;
  }

  .controls{
    display:grid;
    grid-template-columns: 400px 400px;
    gap:10px;
    align-items:start;
  }

  .panel{
    min-width:0;
    margin-top:0px;
  }

  .panel h2{
    margin:0px 0 6px;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-family:"BentonStrong", sans-serif;
  }

  button,
  input{
    font:inherit;
  }

  #clearFilters{
    font-family:"BentonMedium";
    appearance:none;
    background:#fff;
    color:#000;
    cursor:pointer;
    border:2px solid black;
    font-size:14px;
    margin-top:5px;
    margin-bottom:5px;
    line-height:1;
  }

  #clearFilters:hover{
    background:var(--hover);
  }

  .meta{
    margin:10px;
    font-size:14px;
    color:black;
  }

  .filter-btn{
    appearance:none;
    background:#fff;
    color:#000;
    border:1px solid black;
    padding:2px 4px;
    cursor:pointer;
    display:inline-flex;
    align-items:left;
    gap:4px;
    line-height:1;
    font-size:14px;
    text-align:left;
  }

  .filter-btn:hover{
    background:var(--hover);
  }

  .filter-btn.active{
    background:var(--active);
    color:var(--activeText);
    border-color:#000;
  }

  .filter-btn .count{
    font-size:14px;
    opacity:1;
  }

  .button-group{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
  }

  .tag-search-wrap{
    margin:0 0 10px;
  }

  .hint{
    font-size:14px;
    color:var(--muted);
    line-height:1;
    padding:6px 0;
  }

  .show-more-wrap{
    margin-top:10px;
  }

  .secondary-btn{
    font-family:"BentonMedium";
    appearance:none;
    background:#fff;
    color:#000;
    padding:2px 4px;
    cursor:pointer;
    border:2px solid black;
    font-size:14px;
  }

  .secondary-btn:hover{
    background:var(--hover);
  }

  .section-chart-wrap{
    background:#fff;
  }

  .section-chart-note{
    font-size:14px;
    color:var(--muted);
    margin:0 0 8px;
  }

  #sectionChart svg{
    display:block;
    width:auto;
    height:auto;
    max-width:none;
  }

  .section-bar-row text{
    font-size:14px;
    fill:#000;
  }

  .section-bar-row .count-label{
    font-size:14px;
    fill:#555;
  }

  .section-bar{
    cursor:pointer;
    transition: opacity 0.15s ease;
  }

  .section-bar:hover{
    opacity:0.8;
  }

  .section-bar.active{
    stroke:#000;
    stroke-width:1.5px;
  }

  .section-bar-label{
    cursor:pointer;
  }

  .section-bar-row.active .section-bar-label,
  .section-bar-row.active .count-label{
    font-weight:bold;
  }

  .table-wrap{
    padding:0px;
    overflow-x:auto;
    max-width:800px;
  }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
  }

  thead th{
    background:var(--bg);
    text-align:left;
    padding:8px 8px 4px;
    border-bottom:2px solid #000;
    white-space:nowrap;
    vertical-align:bottom;
    font-family:"BentonStrong";
  }

  tbody td{
    padding:10px 8px;
    border-bottom:1px solid #e8e8e8;
    vertical-align:top;
  }

  tbody tr:hover{
    background:#fafafa;
  }

  .muted{
    color:var(--muted);
  }

  td.html-cell p{
    margin:0 0 8px;
  }

  td.html-cell p:last-child{
    margin-bottom:0;
  }

  td.html-cell a,
  td.source-cell a{
    color:#000;
    text-decoration:underline;
  }

  td.entity-cell{
    min-width:220px;
  }

  td.desc-cell{
    min-width:420px;
  }

  td.source-cell{
    min-width:180px;
  }

  td.tags-cell{
    min-width:220px;
  }

  @media (max-width: 1080px){
    .controls{
      grid-template-columns:1fr;
    }
  }

  .meta-block,
  .extras-block{
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .meta-entity{
    font-family:"BentonStrong", sans-serif;
    font-size:14px;
    line-height:1;
  }

  .meta-year,
  .meta-section{
    font-family:"BentonMedium";
  }

  .extras-label{
    font-family:"BentonStrong", sans-serif;
  }

  .extras-source a,
  .desc-cell a{
    color:#000;
    text-decoration:underline;
  }

  .extras-source:empty,
  .extras-tags:empty{
    display:none;
  }

  th:nth-child(1), td.meta-cell{
    width: 180px;
    min-width: 180px;
  }

  th:nth-child(2), td.desc-cell{
    width: auto;
    min-width: 300px;
  }

  th:nth-child(3), td.extras-cell{
    width: 150px;
    min-width: 100px;
  }

  .meta-block,
  .extras-block{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .meta-entity{
    font-family:"BentonStrong", sans-serif;
    font-size:14px;
    line-height:1;
  }

  .meta-year,
  .meta-section,
  .extras-source,
  .extras-tags{
    font-size:14px;
    line-height:1;
  }

  .extras-label{
    font-family:"BentonStrong", sans-serif;
  }

  .extras-source a,
  .desc-cell a{
    color:#000;
    text-decoration:underline;
  }

  .extras-source:empty,
  .extras-tags:empty{
    display:none;
  }

  .controls-footer{
    margin: top 0px;
    padding-top:12px;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:flex-start;
  }

  .controls-bottom-row{
    display:flex;
    justify-content:flex-start;
    align-items:center;
    gap:12px;
  }

  .filter-btn .label{
    font-family:"BentonMedium", sans-serif;
  }

  .filter-btn .count{
    font-family:"Benton", sans-serif;
    opacity:1;
  }

  #tagPanel{
    max-height:160px;
    overflow:auto;
  }

  .tag-btn{
    font-size:12px;
  }

  .tag-btn .count{
    font-size:12px;
  }

  .search-input{
    width:100%;
    padding:6px 8px;
    border:1px solid #000;
    font-size:14px;
    line-height:1.2;
    background:#fff;
    color:#000;
  }

  .search-input:focus{
    outline:none;
  }
  mark.search-highlight{
  background:#fff2a8;
  color:inherit;
  padding:0;
}
@media (max-width: 700px){
  .table-wrap{
    max-width:none;
    overflow-x:visible;
  }

  table,
  thead,
  tbody,
  tr,
  th,
  td{
    display:block;
    width:100%;
  }

  thead{
    display:none;
  }

  tbody tr{
    border-bottom:2px solid #000;
    padding:10px 0;
  }

  tbody td{
    display:block;
    width:100%;
    min-width:0 !important;
    padding:6px 10px;
    border-bottom:none;
  }

  td.meta-cell,
  td.desc-cell,
  td.extras-cell{
    width:100%;
    min-width:0;
  }

  .meta-block,
  .extras-block{
    gap:4px;
  }

  td.desc-cell{
    padding-top:8px;
    padding-bottom:8px;
  }
}
</style>
</head>
<body>
<div class="topbar">
  <h1>Amicus Brief Collection</h1>

  <div class="controls">

    <div class="panel">
      <h2>Search</h2>
      <input
        id="textSearch"
        class="search-input"
        type="text"
        placeholder="Search briefs, summaries, sources, tags..."
      />
    </div>

    <div class="panel">
      <h2>Subject Area</h2>
      <div id="sectionButtons" class="button-group"></div>
    </div>

    <div class="panel">
      <h2>Tags</h2>
      <div id="tagPanel"></div>
    </div>

  </div>

  <div class="controls-bottom-row">
    <button class="secondary-btn" id="clearFilters">Clear filters</button>
    <div class="panel">
      <div id="resultCount" class="meta">0 Briefs</div>
    </div>
  </div>
</div>

<div class="table-wrap">
  <table id="dataTable">
    <thead>
      <tr id="tableHead"></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
/* =========================
   CONFIG
========================= */

const CSV_PATH = "output_04142026.csv";

const SECTION_COLUMN = "section";
const TAGS_COLUMN = "tags";
const DISPLAY_COLUMNS = [
  "meta",
  "description_html",
  "extras"
];
const HEADER_LABELS = {
  meta: "BRIEF",
  description_html: "SUMMARY",
  extras: "SOURCE & TAGS"
};
const SECTION_PALETTE = [
  "#9E0B0F"
];

let sectionColorMap = {};

const HTML_COLUMNS = new Set(["description_html", "source"]);

const TAG_SEPARATOR = ",";
const TAG_MULTISELECT = true;
const TAGS_VISIBLE_DEFAULT = 12;

const SECTION_CHART = {
  width: 500,
  rowHeight: 18,
  labelWidth: 250,
  countWidth: 18,
  barHeight: 12,
  top: 4,
  right: 8,
  bottom: 4,
  left: 0
};

/* =========================
   STATE
========================= */

let rawRows = [];
let filteredRows = [];

const activeSections = new Set();
const activeTags = new Set();

let textSearchQuery = "";
let tagSearchQuery = "";
let showAllTags = false;
let tagSearchDebounce = null;

/* =========================
   HELPERS
========================= */

function escapeRegExp(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function highlightText(text, query) {
  const safeText = normalizeValue(text);
  if (!query) return safeText;

  const regex = new RegExp(`(${escapeRegExp(query)})`, "gi");
  return safeText.replace(regex, '<mark class="search-highlight">$1</mark>');
}

function highlightHtmlPreservingTags(html, query) {
  const safeHtml = normalizeValue(html);
  if (!query) return safeHtml;

  const container = document.createElement("div");
  container.innerHTML = safeHtml;

  function walk(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      const text = node.nodeValue;
      if (!text || !query) return;

      const regex = new RegExp(escapeRegExp(query), "gi");
      if (!regex.test(text)) return;

      regex.lastIndex = 0;

      const frag = document.createDocumentFragment();
      let lastIndex = 0;
      let match;

      while ((match = regex.exec(text)) !== null) {
        const before = text.slice(lastIndex, match.index);
        if (before) frag.appendChild(document.createTextNode(before));

        const mark = document.createElement("mark");
        mark.className = "search-highlight";
        mark.textContent = match[0];
        frag.appendChild(mark);

        lastIndex = match.index + match[0].length;
      }

      const after = text.slice(lastIndex);
      if (after) frag.appendChild(document.createTextNode(after));

      node.parentNode.replaceChild(frag, node);
      return;
    }

    if (node.nodeType === Node.ELEMENT_NODE) {
      if (node.tagName === "MARK") return;
      [...node.childNodes].forEach(walk);
    }
  }

  [...container.childNodes].forEach(walk);
  return container.innerHTML;
}

function stripHtml(html) {
  const div = document.createElement("div");
  div.innerHTML = normalizeValue(html);
  return div.textContent || div.innerText || "";
}

function buildSearchText(row) {
  return [
    row.entity,
    row.year,
    row.section,
    stripHtml(row.description_html),
    row.source,
    row.tags
  ]
    .map(normalizeValue)
    .join(" ")
    .toLowerCase();
}

function toggleSection(section) {
  if (activeSections.has(section)) {
    activeSections.clear();
  } else {
    activeSections.clear();
    activeSections.add(section);
  }

  activeTags.clear();
  showAllTags = false;

  applyFilters();
  renderSectionButtons();
  renderTagPanel();
}

function buildSectionColorMap() {
  const sectionNames = uniqueSorted(
    rawRows.map(row => normalizeValue(row[SECTION_COLUMN])).filter(Boolean)
  );

  sectionColorMap = {};
  sectionNames.forEach((name, i) => {
    sectionColorMap[name] = SECTION_PALETTE[i % SECTION_PALETTE.length];
  });
}

function getSectionColor(section) {
  return sectionColorMap[normalizeValue(section)] || "#cccccc";
}

function normalizeValue(v) {
  return (v ?? "").toString().trim();
}

function parseTags(cellValue) {
  const raw = normalizeValue(cellValue);
  if (!raw) return [];
  return raw
    .split(TAG_SEPARATOR)
    .map(d => d.trim())
    .filter(Boolean);
}

function uniqueSorted(values) {
  return [...new Set(values.filter(Boolean))].sort((a, b) =>
    a.localeCompare(b, undefined, { sensitivity: "base" })
  );
}

function rowMatchesTextSearch(row) {
  if (!textSearchQuery) return true;
  return (row.__searchText || "").includes(textSearchQuery);
}

function rowMatchesSection(row) {
  if (activeSections.size === 0) return true;
  return activeSections.has(normalizeValue(row[SECTION_COLUMN]));
}

function rowMatchesTags(row) {
  if (activeTags.size === 0) return true;
  const rowTags = row.__parsedTags || [];
  return rowTags.some(tag => activeTags.has(tag));
}

function updateCount() {
  const el = document.getElementById("resultCount");
  el.textContent = `${filteredRows.length} Brief${filteredRows.length === 1 ? "" : "s"}`;
}

function buildTableHead() {
  const tr = document.getElementById("tableHead");
  tr.innerHTML = "";

  DISPLAY_COLUMNS.forEach(col => {
    const th = document.createElement("th");
    th.textContent = HEADER_LABELS[col] || col;
    tr.appendChild(th);
  });
}

function getColumnClass(col) {
  if (col === "meta") return "meta-cell";
  if (col === "description_html") return "html-cell desc-cell";
  if (col === "extras") return "extras-cell";
  return "";
}
function renderTable(rows) {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  if (!rows.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = DISPLAY_COLUMNS.length;
    td.className = "muted";
    td.textContent = "No matching rows.";
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }

  rows.forEach(row => {
    const tr = document.createElement("tr");

    DISPLAY_COLUMNS.forEach(col => {
      const td = document.createElement("td");
      td.className = getColumnClass(col);

      if (col === "meta") {
        td.innerHTML = `
          <div class="meta-block">
            <div class="meta-entity">${highlightText(row.entity, textSearchQuery)}</div>
            <div class="meta-year">${highlightText(row.year, textSearchQuery)}</div>
            <div class="meta-section" style="color:${getSectionColor(row.section)};">
              ${highlightText(row.section, textSearchQuery)}
            </div>
          </div>
        `;
      } else if (col === "description_html") {
        td.innerHTML = highlightHtmlPreservingTags(row.description_html, textSearchQuery);
      } else if (col === "extras") {
        const tags = (row.__parsedTags || []).join(", ");
        td.innerHTML = `
          <div class="extras-block">
            <div class="extras-source">
              ${highlightText(row.source, textSearchQuery)}
            </div>
            <div class="extras-tags">
              <span class="extras-label"><br></span> ${highlightText(tags, textSearchQuery)}
            </div>
          </div>
        `;
      } else {
        td.innerHTML = highlightText(row[col], textSearchQuery);
      }

      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
}

function applyFilters() {
  filteredRows = rawRows
    .filter(row =>
      rowMatchesTextSearch(row) &&
      rowMatchesSection(row) &&
      rowMatchesTags(row)
    )
    .sort((a, b) => {
      const ya = parseInt(a.year) || 0;
      const yb = parseInt(b.year) || 0;

      if (yb !== ya) return yb - ya;
      return a.entity.localeCompare(b.entity);
    });

  renderTable(filteredRows);
  updateCount();
}

/* =========================
   SECTION CHART DATA
========================= */

function getSectionCounts() {
  const counts = new Map();

  rawRows.forEach(row => {
    if (!rowMatchesTextSearch(row)) return;
    if (!rowMatchesTags(row)) return;

    const section = normalizeValue(row[SECTION_COLUMN]);
    if (!section) return;
    counts.set(section, (counts.get(section) || 0) + 1);
  });

  return [...counts.entries()]
    .map(([section, count]) => ({ section, count }))
    .sort((a, b) => {
      const diff = b.count - a.count;
      if (diff !== 0) return diff;
      return a.section.localeCompare(b.section, undefined, { sensitivity: "base" });
    });
}

/* =========================
   TAG DATA
========================= */

function getAdaptiveTagData() {
  const counts = {};

  rawRows.forEach(row => {
    if (!rowMatchesTextSearch(row)) return;
    if (!rowMatchesSection(row)) return;

    (row.__parsedTags || []).forEach(tag => {
      counts[tag] = (counts[tag] || 0) + 1;
    });
  });

  let allTags = Object.keys(counts);

  if (tagSearchQuery) {
    const q = tagSearchQuery.toLowerCase();
    allTags = allTags.filter(tag => tag.toLowerCase().includes(q));
  }

  const sortedTags = allTags.sort((a, b) => {
    const diff = (counts[b] || 0) - (counts[a] || 0);
    if (diff !== 0) return diff;
    return a.localeCompare(b, undefined, { sensitivity: "base" });
  });

  const visibleTags = showAllTags
    ? sortedTags
    : sortedTags.slice(0, TAGS_VISIBLE_DEFAULT);

  const hiddenCount = Math.max(0, sortedTags.length - visibleTags.length);

  return {
    allTags: sortedTags,
    counts,
    visibleTags,
    hiddenCount
  };
}

/* =========================
   RENDER SECTION BUTTONS
========================= */

function renderSectionButtons() {
  const container = document.getElementById("sectionButtons");
  container.innerHTML = "";

  const counts = {};

  rawRows.forEach(row => {
    if (!rowMatchesTextSearch(row)) return;
    if (!rowMatchesTags(row)) return;

    const section = normalizeValue(row[SECTION_COLUMN]);
    if (!section) return;

    counts[section] = (counts[section] || 0) + 1;
  });

  const sections = Object.keys(counts).sort((a, b) => {
    const diff = counts[b] - counts[a];
    if (diff !== 0) return diff;
    return a.localeCompare(b, undefined, { sensitivity: "base" });
  });

  sections.forEach(section => {
    const btn = document.createElement("button");
    btn.className = "filter-btn section-btn";

    const color = getSectionColor(section);

    btn.style.borderColor = color;
    btn.style.color = color;

    if (activeSections.has(section)) {
      btn.classList.add("active");
      btn.style.backgroundColor = color;
      btn.style.color = "#fff";
    }

    btn.innerHTML = `
      <span class="label">${section}</span>
      <span class="count">${counts[section]}</span>
    `;

    btn.addEventListener("click", () => toggleSection(section));

    container.appendChild(btn);
  });
}

function renderSectionChart() {
  const container = d3.select("#sectionChart");
  container.selectAll("*").remove();

  const data = getSectionCounts();

  if (!data.length) {
    container.append("div")
      .attr("class", "hint")
      .text("No sections available.");
    return;
  }

  const width = SECTION_CHART.width;
  const rowHeight = SECTION_CHART.rowHeight;
  const labelWidth = SECTION_CHART.labelWidth;
  const countWidth = SECTION_CHART.countWidth;
  const barHeight = SECTION_CHART.barHeight;
  const margin = {
    top: SECTION_CHART.top,
    right: SECTION_CHART.right,
    bottom: SECTION_CHART.bottom,
    left: SECTION_CHART.left
  };

  const innerWidth = width - margin.left - margin.right;
  const barAreaWidth = innerWidth - labelWidth - countWidth - 12;
  const height = margin.top + margin.bottom + data.length * rowHeight;

  const x = d3.scaleLinear()
    .domain([0, d3.max(data, d => d.count) || 1])
    .range([0, barAreaWidth]);

  const svg = container.append("svg")
    .attr("id", "sectionChartSvg")
    .attr("width", width)
    .attr("height", height);

  const g = svg.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  const rows = g.selectAll(".section-bar-row")
    .data(data, d => d.section)
    .join("g")
    .attr("class", d => `section-bar-row${activeSections.has(d.section) ? " active" : ""}`)
    .attr("transform", (d, i) => `translate(0, ${i * rowHeight})`);

  rows.append("text")
    .attr("class", "section-bar-label")
    .attr("x", labelWidth - 4)
    .attr("y", rowHeight / 2)
    .attr("dy", "0.35em")
    .attr("text-anchor", "end")
    .text(d => d.section)
    .on("click", (_, d) => toggleSection(d.section));

  rows.append("rect")
    .attr("class", d => `section-bar${activeSections.has(d.section) ? " active" : ""}`)
    .attr("x", labelWidth)
    .attr("y", (rowHeight - barHeight) / 2)
    .attr("width", d => x(d.count))
    .attr("height", barHeight)
    .attr("fill", d => getSectionColor(d.section))
    .on("click", (_, d) => toggleSection(d.section));

  rows.append("text")
    .attr("class", "count-label")
    .attr("x", d => labelWidth + x(d.count) + 6)
    .attr("y", rowHeight / 2)
    .attr("dy", "0.35em")
    .text(d => d.count)
    .on("click", (_, d) => toggleSection(d.section));
}

/* =========================
   RENDER TAG PANEL
========================= */

function makeTagButton(tag, count, isActive) {
  const btn = document.createElement("button");
  btn.className = "filter-btn tag-btn";
  if (isActive) btn.classList.add("active");

  btn.innerHTML = `
    <span class="label">${tag}</span>
    <span class="count">${count}</span>
  `;

  btn.addEventListener("click", () => {
    if (activeTags.has(tag)) {
      activeTags.delete(tag);
    } else {
      activeTags.add(tag);
    }

    applyFilters();
    renderSectionButtons();
    renderTagPanel();
  });

  return btn;
}

function renderTagPanel() {
  const panel = document.getElementById("tagPanel");
  panel.innerHTML = "";

  const { counts, visibleTags, hiddenCount, allTags } = getAdaptiveTagData();

  const scrollArea = document.createElement("div");
  scrollArea.className = "tag-scroll-area";

  if (!showAllTags) {
    scrollArea.classList.add("is-collapsed");
  }

  panel.appendChild(scrollArea);

  if (!allTags.length) {
    const empty = document.createElement("div");
    empty.className = "hint";
    empty.textContent = "No tags found.";
    scrollArea.appendChild(empty);
  } else {
    const tagButtons = document.createElement("div");
    tagButtons.className = "button-group";

    visibleTags.forEach(tag => {
      tagButtons.appendChild(
        makeTagButton(tag, counts[tag] || 0, activeTags.has(tag))
      );
    });

    scrollArea.appendChild(tagButtons);
  }

  if (hiddenCount > 0) {
    const moreWrap = document.createElement("div");
    moreWrap.className = "show-more-wrap";

    const moreBtn = document.createElement("button");
    moreBtn.className = "secondary-btn";
    moreBtn.textContent = `Show ${hiddenCount} more tags`;

    moreBtn.addEventListener("click", () => {
      showAllTags = true;
      renderTagPanel();
    });

    moreWrap.appendChild(moreBtn);
    panel.appendChild(moreWrap);
  }

  if (showAllTags && allTags.length > TAGS_VISIBLE_DEFAULT) {
    const lessWrap = document.createElement("div");
    lessWrap.className = "show-more-wrap";

    const lessBtn = document.createElement("button");
    lessBtn.className = "secondary-btn";
    lessBtn.textContent = "Show fewer tags";

    lessBtn.addEventListener("click", () => {
      showAllTags = false;
      renderTagPanel();
    });

    lessWrap.appendChild(lessBtn);
    panel.appendChild(lessWrap);
  }
}

/* =========================
   LOAD CSV
========================= */

function loadCSV() {
  Papa.parse(CSV_PATH, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: results => {
      rawRows = results.data.map(row => {
        const parsedTags = parseTags(row[TAGS_COLUMN]);
        return {
          ...row,
          __parsedTags: parsedTags,
          __searchText: buildSearchText(row)
        };
      });

      buildSectionColorMap();
      buildTableHead();
      applyFilters();
      renderSectionButtons();
      renderTagPanel();
    },
    error: err => {
      console.error("CSV load error:", err);
      document.getElementById("tableBody").innerHTML = `
        <tr>
          <td colspan="${DISPLAY_COLUMNS.length}" class="muted">
            Could not load CSV. Check CSV_PATH and file location.
          </td>
        </tr>
      `;
    }
  });
}

/* =========================
   EVENTS
========================= */

document.getElementById("textSearch").addEventListener("input", e => {
  textSearchQuery = normalizeValue(e.target.value).toLowerCase();
  applyFilters();
  renderSectionButtons();
  renderTagPanel();
});

/* =========================
   CLEAR
========================= */

document.getElementById("clearFilters").addEventListener("click", () => {
  activeSections.clear();
  activeTags.clear();
  textSearchQuery = "";
  tagSearchQuery = "";
  showAllTags = false;

  const searchInput = document.getElementById("textSearch");
  if (searchInput) searchInput.value = "";

  applyFilters();
  renderSectionButtons();
  renderTagPanel();
});

/* =========================
   INIT
========================= */

loadCSV();
</script>
</body>
</html>
